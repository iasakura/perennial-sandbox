# CI: go build → goose 翻訳 → rocq compile (証明チェック)
#
# サプライチェーン方針:
#   - action は GitHub 公式 (actions/*) のみ。サードパーティ action は使わない。
#   - すべて commit SHA で固定 (タグは動かせるが SHA は動かせない)。
#     コメントの vX.Y.Z は人間用のメモ。更新時は新タグの SHA を取り直すこと:
#       git ls-remote https://github.com/actions/checkout 'refs/tags/vX.Y.Z^{}'
#   - opam 依存は perennial-sandbox.opam の pin-depends で全部 git SHA 固定済み。
#   - perennial の checkout も opam pin と同一 SHA を fetch する。
#
# 初回 (キャッシュなし) は Perennial のビルドで数時間かかる。2回目以降は
# _opam キャッシュが効いて goose + 証明チェックだけになる。

name: CI

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # perennial-sandbox.opam の pin-depends と同じ SHA に保つこと
  PERENNIAL_COMMIT: f884a505d89d3f6740f4baec515602494a9bd4cc

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: '1.26.0'

      - name: Install opam
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends opam

      - name: Restore opam cache
        id: opam-cache
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.opam
            _opam
          key: opam-${{ runner.os }}-ocaml-5.2.0-${{ hashFiles('perennial-sandbox.opam') }}

      - name: Set up opam switch (slow on cache miss)
        run: |
          if [ ! -d "$HOME/.opam" ]; then
            opam init --bare --disable-sandboxing -y
          fi
          if [ ! -d _opam ]; then
            opam switch create . ocaml-base-compiler.5.2.0 --no-install -y
          fi
          opam install ./perennial-sandbox.opam --deps-only -y

      # 途中で落ちても opam のビルド結果は保存して次回再開できるようにする
      - name: Save opam cache
        if: always() && steps.opam-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.opam
            _opam
          key: opam-${{ runner.os }}-ocaml-5.2.0-${{ hashFiles('perennial-sandbox.opam') }}

      - name: Fetch perennial (goose source, same commit as the opam pin)
        run: |
          git init "$HOME/perennial"
          git -C "$HOME/perennial" remote add origin https://github.com/mit-pdos/perennial
          git -C "$HOME/perennial" fetch --depth 1 origin "$PERENNIAL_COMMIT"
          git -C "$HOME/perennial" checkout FETCH_HEAD

      - name: Build (go build → goose → proof check)
        run: opam exec -- env PERENNIAL="$HOME/perennial" ./build.sh
